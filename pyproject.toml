[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connect4"
version = "2.0.0"
description = "Production-grade Connect 4 engine, AI algorithms, and visualizer."
authors = [{ name = "Mayank Singh" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.0.0",
    "numpy>=1.20.0",
    "event-bus>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
connect4 = "connect4.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["connect4*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
